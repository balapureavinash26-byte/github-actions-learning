name: Reusable CI Workflow

on:
  workflow_call:

    inputs:
      app_name:
        description: "Application name"
        required: true
        type: string

    secrets:
      demo_secret:
        description: "Demo secret"
        required: true

jobs:

  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Application
        run: |
          echo "===== REUSABLE WORKFLOW ====="
          echo "Build started..."
          echo "Building ${{ inputs.app_name }}..."
          echo "Build completed successfully!"

      - name: Run Tests
        run: |
          echo "===== TEST ====="
          echo "Testing ${{ inputs.app_name }}..."
          echo "All tests passed successfully!"

      - name: Check Secret Availability
        env:
          DEMO_SECRET: ${{ secrets.demo_secret }}
        run: |
          echo "===== SECRET CHECK ====="

          if [ -n "$DEMO_SECRET" ]; then
            echo "Secret is available to the reusable workflow."
          else
            echo "Secret is NOT available."
            exit 1
          fi
